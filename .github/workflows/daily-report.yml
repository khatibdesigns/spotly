name: Spotly daily report

# Emails a daily app-health + traffic report to nader@khatibdesigns.com.
# Data: Firestore (app health) + GA4 (app/site usage) + Search Console (organic SEO).
# Auth: the GA4_KEY secret (a service-account JSON) via GOOGLE_APPLICATION_CREDENTIALS,
#       matching the existing SEO report's convention. Delivery: FormSubmit.
on:
  schedule:
    - cron: '0 5 * * *' # 05:00 UTC = 08:00 Asia/Kuwait
  workflow_dispatch: {} # run on demand from the Actions tab

permissions:
  contents: read

concurrency:
  group: spotly-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/report
        run: npm install --no-audit --no-fund

      # Same convention as the existing SEO report: the service-account JSON is
      # stored in the GA4_KEY secret and written to a file for ADC.
      - name: Write service-account key from secret
        run: printf '%s' "$GA4_KEY" > "$RUNNER_TEMP/sa-key.json"
        env:
          GA4_KEY: ${{ secrets.GA4_KEY }}

      - name: Build & send report
        working-directory: tools/report
        env:
          # One credential for Firestore + GA4 + Search Console.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa-key.json
          # Optional: a separate Firestore SA if GA4_KEY can't read spotly-6ca9a.
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}
          # GA4 numeric property id — the Spotly property (spotly-6ca9a).
          GA4_PROPERTY: ${{ secrets.GA4_PROPERTY || '538818604' }}
          # Search Console property (DNS-verified domain).
          GSC_SITE: ${{ secrets.GSC_SITE || 'sc-domain:meetspotly.com' }}
          # Email delivery. Web3Forms (free access key) works from CI; FormSubmit
          # is the keyless fallback but Cloudflare 403s GitHub's datacenter IPs.
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO || 'nader@khatibdesigns.com' }}
        run: node daily-report.mjs
