<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Spotly · Command Center</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--coral:#fa7959;--coral-dk:#e0613f;--ink:#2b2622;--ink2:#6f675f;--ink3:#a59c92;--line:#ece7df;--bg:#fbf8f2;--card:#fff;--good:#2e7d57;--bad:#c0392b;--premium:#7b5cff;--sun:#f0a93b;--shadow:0 1px 3px rgba(43,38,34,.06),0 8px 24px rgba(43,38,34,.05)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:60px}
  .hide{display:none!important}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:10;background:rgba(251,248,242,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .head-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--coral),var(--sun));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;box-shadow:var(--shadow)}
  .brand h1{font-size:18px;font-weight:800;letter-spacing:-.4px}
  .brand p{font-size:12px;color:var(--ink3);font-weight:600}
  .head-actions{display:flex;align-items:center;gap:12px}
  .updated{font-size:12px;color:var(--ink3);text-align:right;line-height:1.4}.updated b{color:var(--ink2)}
  button.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;padding:9px 15px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
  button.btn:hover{border-color:var(--coral);color:var(--coral-dk)}button.btn:disabled{opacity:.5;cursor:default}
  .spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
  /* login */
  .login-wrap{min-height:78vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:34px 30px;width:100%;max-width:380px;text-align:center}
  .login-card .logo{width:54px;height:54px;border-radius:15px;margin:0 auto 16px;font-size:27px}
  .login-card h2{font-size:21px;font-weight:800;letter-spacing:-.5px}
  .login-card p{font-size:13px;color:var(--ink2);margin-top:6px;font-weight:500}
  .login-card input{width:100%;border:1px solid var(--line);background:#fcfaf6;border-radius:11px;padding:13px 14px;font-size:15px;margin-top:12px;color:var(--ink)}
  .login-card input:focus{outline:none;border-color:var(--coral)}
  .login-card button{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--coral),var(--coral-dk));color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}
  .login-card button:disabled{opacity:.6}
  .login-err{color:var(--bad);font-size:12.5px;font-weight:600;margin-top:12px;min-height:16px}
  section{margin-top:30px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink2)}
  .sec-head .dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
  .sec-head .note{font-size:12px;color:var(--ink3);font-weight:600}
  .grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3)}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:7px;line-height:1}
  .kpi .sub{font-size:12px;color:var(--ink2);font-weight:600;margin-top:7px}
  .stat .lbl{font-size:12px;color:var(--ink2);font-weight:700}.stat .val{font-size:23px;font-weight:800;letter-spacing:-.6px;margin-top:5px}.stat .sub{font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:3px}
  .delta{font-size:12px;font-weight:800}.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--ink3)}
  .chip{display:inline-block;background:#f6f1e9;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;color:var(--ink2);margin:2px 3px 0 0}
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px 10px;box-shadow:var(--shadow)}.chart-card h3{font-size:13px;font-weight:800;margin-bottom:4px}.chart-wrap{position:relative;height:230px}
  table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}tr:last-child td{border-bottom:none}
  .muted{color:var(--ink3);font-weight:600}.err{background:#fff3f0;border:1px solid #f3c9bd;color:#9a3b22;border-radius:10px;padding:10px 13px;font-size:12.5px;font-weight:600}
  .flag{font-size:11px;font-weight:800;color:var(--ink3);width:34px;display:inline-block}
  .bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}.bar-row .n{width:120px;font-size:12.5px;font-weight:700}.bar-track{flex:1;height:9px;background:#f1ebe2;border-radius:5px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--coral),var(--sun));border-radius:5px}.bar-row .v{width:60px;text-align:right;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .loading{text-align:center;padding:70px 0;color:var(--ink3);font-weight:700}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.g4,.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
  @media(max-width:560px){.kpis,.g4,.g3,.g2{grid-template-columns:1fr 1fr}.brand p{display:none}}
</style>
</head>
<body>
<header><div class="wrap head-row">
  <div class="brand"><div class="logo">S</div><div><h1>Spotly Command Center</h1><p>Everything about the business, in one place</p></div></div>
  <div class="head-actions" id="headActions" style="display:none">
    <div class="updated" id="updated"></div>
    <button class="btn" id="refreshBtn"><span id="rIcon">⟳</span> Refresh</button>
    <button class="btn" id="logoutBtn">Sign out</button>
  </div>
</div></header>

<!-- Login -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="logo">S</div>
    <h2>Command Center</h2>
    <p>Sign in with your Spotly admin account</p>
    <form id="loginForm" autocomplete="on">
      <input type="email" id="email" placeholder="Email" autocomplete="username" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit" id="loginBtn">Sign in</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<div class="wrap hide" id="appWrap"><div id="root"><div class="loading">Loading live metrics…</div></div></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
const firebaseConfig = { apiKey:"AIzaSyANYIyuxNtP-of3AhrdXF0MS8BM73Ja6tM", authDomain:"spotly-6ca9a.firebaseapp.com", projectId:"spotly-6ca9a" };
const auth = getAuth(initializeApp(firebaseConfig));
// When the page is served from the GitHub-Pages site, the API lives on the EC2 host.
const onMainSite = location.hostname === 'meetspotly.com' || location.hostname === 'www.meetspotly.com';
const API_BASE = onMainSite ? 'https://hq.meetspotly.com' : '';

const $ = (id) => document.getElementById(id);
const show = (el, on) => $(el).classList.toggle('hide', !on);
function showLogin(){ $('login').classList.remove('hide'); show('appWrap', false); $('headActions').style.display='none'; }
function showApp(){ $('login').classList.add('hide'); show('appWrap', true); $('headActions').style.display='flex'; }

const fmt=(n)=>(n==null||n===''||Number.isNaN(n))?'—':Number(n).toLocaleString('en-US');
const fmt1=(n)=>(n==null)?'—':Number(n).toFixed(1);
const pct=(n)=>(n==null)?'—':(n*100).toFixed(1)+'%';
const esc=(x)=>String(x==null?'':x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const kpi=(l,v,s)=>`<div class="card kpi"><div class="lbl">${l}</div><div class="val">${v}</div><div class="sub">${s||''}</div></div>`;
const stat=(l,v,s)=>`<div class="card stat"><div class="lbl">${l}</div><div class="val">${v}</div><div class="sub">${s||''}</div></div>`;
function deltaHTML(cur,prev,opt={}){ if(cur==null||prev==null)return''; const d=cur-prev,p=prev?(d/prev*100):null,better=opt.lowerIsBetter?d<0:d>0,cls=d===0?'flat':(better?'up':'down'),arrow=d>0?'▲':(d<0?'▼':'—'),val=opt.position?(d>0?'+':'')+d.toFixed(1):(p!=null?(d>0?'+':'')+p.toFixed(0)+'%':(d>0?'+':'')+fmt(d)); return `<span class="delta ${cls}">${arrow} ${val} <span class="muted" style="font-weight:600">WoW</span></span>`; }
function barRow(n,v,max){const w=max?Math.max(3,Math.round(v/max*100)):0;return `<div class="bar-row"><div class="n">${n}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><div class="v">${fmt(v)}</div></div>`;}
const charts={};
function lineChart(id,labels,datasets){ if(charts[id])charts[id].destroy(); charts[id]=new Chart($(id),{type:'line',data:{labels,datasets:datasets.map(d=>({...d,tension:.35,borderWidth:2.5,pointRadius:0,pointHoverRadius:4,fill:d.fill??false}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:datasets.length>1,position:'top',align:'end',labels:{boxWidth:10,boxHeight:10,font:{size:11,weight:'600'},color:'#6f675f'}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:8,font:{size:10},color:'#a59c92'}},y:{beginAtZero:true,grid:{color:'#f1ebe2'},ticks:{font:{size:10},color:'#a59c92',precision:0}}}}}); }

function render(d){
  const f=d.firestore||{},g=d.ga4||{},s=d.gsc||{},a=d.appstore||{},G=d.growth||[];
  const ratingTxt=a.primary?`${fmt1(a.primary.avg)}★`:(a.empty?'No ratings':'—');
  let html=`<section style="margin-top:22px"><div class="grid kpis">
    ${kpi('👨‍👩‍👧 Families',fmt(f.familiesTotal),`+${fmt(f.familiesNew7)} this week`)}
    ${kpi('📱 Active devices',fmt(f.withFcm),'push-registered')}
    ${kpi('🗺️ AI Plans',fmt(f.plansTotal),`+${fmt(f.plansNew24)} today`)}
    ${kpi('⭐ App Store',ratingTxt,a.primary?`${fmt(a.totalCount)} ratings`:'')}
    ${kpi('🔎 SEO clicks',s.totals?fmt(s.totals.clicks):'—','7-day search')}
    ${kpi('📸 Memories',fmt(f.memoriesTotal),`+${fmt(f.memoriesNew24)} today`)}
  </div></section>`;
  if(G.length){ html+=`<section><div class="sec-head"><span class="dot"></span><h2>Growth over time</h2><span class="note">last ${G.length} days · cumulative</span></div><div class="grid g2"><div class="chart-card"><h3>Families</h3><div class="chart-wrap"><canvas id="cGrowth"></canvas></div></div><div class="chart-card"><h3>AI plans &amp; memories</h3><div class="chart-wrap"><canvas id="cContent"></canvas></div></div></div></section>`; }
  html+=`<section><div class="sec-head"><span class="dot"></span><h2>App health</h2><span class="note">live · Firestore</span></div><div class="grid g4">
    ${stat('Families',fmt(f.familiesTotal),`+${fmt(f.familiesNew24)} / 24h · +${fmt(f.familiesNew7)} / 7d`)}
    ${stat('Active devices',fmt(f.withFcm),'have push token')}
    ${stat('AI plans',fmt(f.plansTotal),`+${fmt(f.plansNew24)} today`)}
    ${stat('Memories',fmt(f.memoriesTotal),`+${fmt(f.memoriesNew24)} today`)}
    ${stat('Bookings',fmt(f.bookingsTotal),`+${fmt(f.bookingsNew24)} today`)}
    ${stat('Places (curated)',fmt(f.placesTotal),`${fmt(f.merchantsTotal)} merchants`)}
    ${stat('Screened places',fmt(f.screenedTotal),`${pct(f.keptRatio)} kept (${fmt(f.screenedKept)})`)}
    ${stat('Voucher orders',fmt(f.voucherOrdersTotal),`+${fmt(f.voucherOrdersNew24)} today`)}
  </div></section>`;
  html+=`<section><div class="sec-head"><span class="dot"></span><h2>Engagement</h2><span class="note">GA4 · app + web</span></div>`;
  if(g.error)html+=`<div class="err">⚠️ GA4: ${esc(g.error)}</div>`;
  else if(!g.configured)html+=`<div class="err">GA4 not configured.</div>`;
  else{ html+=`<div class="grid g4">
    ${stat('Active users · 7d',fmt(g.last7?.activeUsers),deltaHTML(g.last7?.activeUsers,g.last7prev?.activeUsers))}
    ${stat('New users · 7d',fmt(g.last7?.newUsers),deltaHTML(g.last7?.newUsers,g.last7prev?.newUsers))}
    ${stat('Sessions · 7d',fmt(g.last7?.sessions),deltaHTML(g.last7?.sessions,g.last7prev?.sessions))}
    ${stat('Active · yesterday',fmt(g.yesterday?.activeUsers),`${fmt(g.yesterday?.sessions)} sessions`)}
    ${stat('Screen views · 7d',fmt(g.last7?.views),deltaHTML(g.last7?.views,g.last7prev?.views))}
    ${stat('Website users · 7d',fmt(g.web?.last7?.activeUsers),`${fmt(g.web?.last7?.views)} pageviews`)}
    ${stat('Website · yesterday',fmt(g.web?.yesterday?.activeUsers),`${fmt(g.web?.yesterday?.sessions)} sessions`)}
    ${stat('Beta CTA · 7d',fmt(g.testerClicks?.last7),'tester_join_click')}
  </div>`; if(g.channels?.length){const mx=Math.max(...g.channels.map(c=>c.sessions));html+=`<div class="card" style="margin-top:14px"><h3 style="font-size:13px;font-weight:800;margin-bottom:10px">Top acquisition channels · 7d</h3>${g.channels.map(c=>barRow(c.name,c.sessions,mx)).join('')}</div>`;} html+=`</div>`; }
  html+=`</section>`;
  html+=`<section><div class="sec-head"><span class="dot"></span><h2>SEO &amp; Search</h2><span class="note">Search Console · ${s.window?`${s.window.startDate} → ${s.window.endDate}`:'meetspotly.com'}</span></div>`;
  if(s.error)html+=`<div class="err">⚠️ Search Console: ${esc(s.error)}</div>`;
  else if(!s.configured)html+=`<div class="err">Search Console not configured.</div>`;
  else{ html+=`<div class="grid g4">
    ${stat('Clicks · 7d',fmt(s.totals?.clicks),deltaHTML(s.totals?.clicks,s.prev?.clicks))}
    ${stat('Impressions · 7d',fmt(s.totals?.impressions),deltaHTML(s.totals?.impressions,s.prev?.impressions))}
    ${stat('Avg CTR',pct(s.totals?.ctr),'')}
    ${stat('Avg position',fmt1(s.totals?.position),deltaHTML(s.totals?.position,s.prev?.position,{position:true,lowerIsBetter:true}))}
  </div>`;
  if(d.indexing && !d.indexing.error){
    const ix=d.indexing, ni=ix.total-ix.indexed;
    html+=`<div style="margin-top:8px"><span class="chip" style="color:#2e7d57">✅ ${ix.indexed} of ${ix.total} pages indexed by Google</span>${ni>0?`<span class="chip" style="color:#9a6b1f">⏳ ${ni} not yet indexed</span>`:''}${s.coverage?`<span class="chip">${fmt(s.coverage.sitemaps)} sitemap${s.coverage.sitemaps==1?'':'s'}</span>`:''}</div>`;
    const st=Object.entries(ix.states||{}).sort((a,b)=>b[1]-a[1]);
    if(st.length) html+=`<div style="font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:6px">${st.map(([k,v])=>`${esc(k)}: ${v}`).join(' · ')}</div>`;
    html+=`<div style="font-size:11px;color:var(--ink3);margin-top:2px">index check: ${new Date(ix.checkedAt).toLocaleDateString()}</div>`;
  } else if(s.coverage){
    html+=`<div style="margin-top:8px"><span class="chip">📄 ${fmt(s.coverage.submitted)} URLs in sitemap</span><span class="chip">${fmt(s.coverage.sitemaps)} sitemap${s.coverage.sitemaps==1?'':'s'}</span></div>`;
  }
  html+=`<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="font-size:13px;font-weight:800;margin-bottom:8px">Top queries · 7d</h3><table><thead><tr><th>Query</th><th class="num">Clicks</th><th class="num">Impr.</th><th class="num">Pos</th></tr></thead><tbody>${(s.queries||[]).map(q=>`<tr><td>${esc(q.q)}</td><td class="num">${fmt(q.clicks)}</td><td class="num">${fmt(q.impressions)}</td><td class="num">${fmt1(q.position)}</td></tr>`).join('')||'<tr><td class="muted" colspan=4>No data yet</td></tr>'}</tbody></table></div><div class="card"><h3 style="font-size:13px;font-weight:800;margin-bottom:8px">📈 Rising queries</h3><table><thead><tr><th>Query</th><th class="num">+Impr</th><th class="num">Clicks</th><th class="num">Pos</th></tr></thead><tbody>${(s.rising||[]).map(q=>`<tr><td>${esc(q.q)}</td><td class="num up">+${fmt(q.impDelta)}</td><td class="num">${fmt(q.clicks)}</td><td class="num">${fmt1(q.position)}</td></tr>`).join('')||'<tr><td class="muted" colspan=4>No data yet</td></tr>'}</tbody></table></div></div>`; }
  html+=`</section>`;
  html+=`<section><div class="sec-head"><span class="dot"></span><h2>App Store</h2><span class="note">all-time ratings</span></div>`;
  if(a.error)html+=`<div class="err">⚠️ App Store: ${esc(a.error)}</div>`;
  else if(a.empty)html+=`<div class="card muted">No ratings yet — they appear once users rate the app.</div>`;
  else if(a.primary){ const mc=Math.max(...a.byCountry.map(c=>c.count)); html+=`<div class="grid g2"><div class="card" style="display:flex;align-items:center;gap:22px"><div><div style="font-size:46px;font-weight:800;letter-spacing:-2px;color:var(--coral-dk)">${fmt1(a.primary.avg)}<span style="font-size:24px">★</span></div><div class="muted" style="font-size:12px">${esc(a.primary.name)} · ${fmt(a.primary.count)} ratings</div></div><div style="border-left:1px solid var(--line);padding-left:22px"><div style="font-size:26px;font-weight:800">${fmt(a.totalCount)}</div><div class="muted" style="font-size:12px">across ${a.byCountry.length} storefronts</div></div></div><div class="card"><h3 style="font-size:13px;font-weight:800;margin-bottom:8px">Ratings by country</h3>${a.byCountry.map(c=>`<div class="bar-row"><div class="n"><span class="flag">${c.cc}</span> ${fmt1(c.avg)}★</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,Math.round(c.count/mc*100))}%"></div></div><div class="v">${fmt(c.count)}</div></div>`).join('')}</div></div>`; }
  html+=`</section>`;
  html+=`<p style="text-align:center;color:var(--ink3);font-size:11.5px;margin-top:34px">Generated ${new Date(d.generatedAt).toLocaleString()} · signed in as ${esc(d.admin||'')} · Spotly</p>`;
  $('root').innerHTML=html;
  if(G.length){const labels=G.map(r=>r.date.slice(5));lineChart('cGrowth',labels,[{label:'Families',data:G.map(r=>r.families),borderColor:'#fa7959',backgroundColor:'rgba(250,121,89,.10)',fill:true}]);lineChart('cContent',labels,[{label:'AI plans',data:G.map(r=>r.plans),borderColor:'#2e7d57',backgroundColor:'rgba(46,125,87,.08)',fill:true},{label:'Memories',data:G.map(r=>r.memories),borderColor:'#f0a93b'}]);}
}

let loading=false;
async function load(force){
  if(loading||!auth.currentUser)return; loading=true;
  $('refreshBtn').disabled=true; $('rIcon').className='spin'; $('updated').innerHTML='Loading…';
  try{
    const token=await auth.currentUser.getIdToken();
    const r=await fetch(API_BASE+'/api/metrics'+(force?'?force=1':''),{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(r.status===401){ $('root').innerHTML=`<div class="err" style="margin-top:30px">This account isn't authorized for the command center. Ask a super-admin to add you, or sign in with your admin account.</div>`; $('updated').textContent='Not authorized'; return; }
    const d=await r.json();
    render(d);
    const when=new Date(d.cachedAt||d.generatedAt);
    $('updated').innerHTML=`<b>Live</b> · ${when.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){ $('updated').textContent='Error'; $('root').innerHTML=`<div class="err" style="margin-top:30px">Couldn't load metrics: ${esc(e.message)}</div>`; }
  finally{ loading=false; $('refreshBtn').disabled=false; $('rIcon').className=''; }
}

$('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault(); $('loginErr').textContent=''; $('loginBtn').disabled=true; $('loginBtn').textContent='Signing in…';
  try{ await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value); }
  catch(err){ $('loginErr').textContent = /invalid|wrong|password|user/i.test(err.code||err.message)?'Wrong email or password.':(err.message||'Sign-in failed.'); }
  finally{ $('loginBtn').disabled=false; $('loginBtn').textContent='Sign in'; }
});
$('logoutBtn').addEventListener('click',()=>signOut(auth));
$('refreshBtn').addEventListener('click',()=>load(true));

onAuthStateChanged(auth, async (user)=>{
  if(!user){ showLogin(); return; }
  showApp(); await load(false);
});
setInterval(()=>{ if(auth.currentUser) load(false); }, 5*60*1000);
</script>
</body>
</html>
