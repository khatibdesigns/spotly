<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Spotly Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{--coral:#fa7959;--coral-dk:#c94c2d;--sage:#398b77;--ink:#1f1915;--ink2:#47413c;--ink3:#7f7974;--line:#e7e3dd;--bg:#f6f4ef;--surface:#fff;--sun:#eebc4a;--sky:#54aad1;--plum:#9c5eaa;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg);}
  .hide{display:none!important}
  a{color:var(--coral-dk)}
  /* Login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .login-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(40,30,20,.08)}
  .brand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--ink);text-decoration:none}
  .dot{width:14px;height:14px;border-radius:50% 50% 50% 0;background:var(--coral);transform:rotate(-45deg);display:inline-block}
  input,select,textarea{width:100%;font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  label.fld{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--coral);color:#fff;border:none;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn.sage{background:var(--sage)} .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)} .btn.sm{padding:7px 13px;font-size:13px}
  .err{color:#c0392b;font-weight:600;font-size:13px;margin-top:8px}
  /* Shell */
  #app{display:flex;min-height:100vh}
  .sidebar{width:236px;background:#1f1915;color:#fff;display:flex;flex-direction:column;padding:20px 14px;position:fixed;top:0;bottom:0;left:0}
  .sidebar .brand{color:#fff;padding:6px 8px 22px}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;color:rgba(255,255,255,.72);font-family:inherit;font-size:14px;font-weight:600;padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.active{background:var(--coral);color:#fff}
  .nav .ico{width:18px;text-align:center;font-size:15px}
  .sidebar .foot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.5);padding:10px 12px}
  .main{margin-left:236px;flex:1;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  .topbar h1{font-family:"Fraunces",serif;font-size:24px;font-weight:600;letter-spacing:-.4px;margin:0}
  .who{font-size:13px;color:var(--ink3)}
  .content{padding:24px 28px 60px}
  /* Cards / KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
  .kpi .n{font-family:"Fraunces",serif;font-size:34px;font-weight:600;letter-spacing:-1px;line-height:1}
  .kpi .l{font-size:12px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
  .panel h2{font-family:"Fraunces",serif;font-size:18px;margin:0 0 14px;font-weight:600}
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
  /* Tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;color:var(--ink3);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink2)}
  tr:hover td{background:#faf8f4}
  td b,td strong{color:var(--ink)}
  td img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--bg)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.req{background:#fdeede;color:#b06a12}.pill.ok{background:#e3f3ea;color:#2c7a4d}.pill.no{background:#fae4e2;color:#b23b2c}.pill.muted{background:#eee9e2;color:#7f7974}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  select.status{padding:6px 8px;border-radius:8px;font-size:12.5px;font-weight:600}
  .danger{color:#c0392b;background:none;border:none;cursor:pointer;font-weight:700;font-size:13px}
  .muted-note{color:var(--ink3);font-size:13px;padding:16px 4px}
  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,15,10,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
  .modal{background:#fff;border-radius:18px;padding:24px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
  .modal h2{font-family:"Fraunces",serif;margin:0 0 14px;font-size:22px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  .amen{display:flex;flex-wrap:wrap;gap:7px}
  .amen label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;width:auto}
  .amen input{width:auto}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.sidebar{width:64px}.sidebar .brand span:last-child,.nav button span.lbl,.sidebar .foot{display:none}.main{margin-left:64px}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <a class="brand"><span class="dot"></span><span>Spotly Admin</span></a>
    <label class="fld" style="margin-top:18px">Email</label>
    <input id="email" type="email" autocomplete="username" />
    <label class="fld">Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <p id="loginErr" class="err"></p>
    <button class="btn" id="loginBtn" style="margin-top:16px;width:100%">Sign in</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <aside class="sidebar">
    <a class="brand"><span class="dot"></span><span>Spotly</span></a>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ico">▦</span><span class="lbl">Dashboard</span></button>
      <button data-view="places"><span class="ico">◎</span><span class="lbl">Places</span></button>
      <button data-view="bookings"><span class="ico">◷</span><span class="lbl">Bookings</span></button>
      <button data-view="vouchers"><span class="ico">🎟</span><span class="lbl">Vouchers</span></button>
      <button data-view="orders" data-admin="1"><span class="ico">▤</span><span class="lbl">Orders</span></button>
      <button data-view="campaigns" data-admin="1"><span class="ico">✦</span><span class="lbl">Campaigns</span></button>
      <button data-view="events" data-admin="1"><span class="ico">✸</span><span class="lbl">Hotspots</span></button>
      <button data-view="reports" data-admin="1"><span class="ico">↧</span><span class="lbl">Reports</span></button>
    </nav>
    <div class="foot">Signed in as<br/><b id="whoFoot" style="color:rgba(255,255,255,.8)"></b></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">Dashboard</h1>
      <div style="display:flex;align-items:center;gap:16px">
        <span class="who" id="who"></span>
        <button class="btn ghost sm" id="signout">Sign out</button>
      </div>
    </div>
    <div class="content">

      <!-- DASHBOARD -->
      <section id="view-dashboard">
        <div class="kpis">
          <div class="kpi"><div class="n" id="kpiPlaces">–</div><div class="l">Curated places</div></div>
          <div class="kpi"><div class="n" id="kpiBookings">–</div><div class="l">Booking requests</div></div>
          <div class="kpi"><div class="n" id="kpiOrders">–</div><div class="l">Album orders</div></div>
          <div class="kpi"><div class="n" id="kpiCampaigns">–</div><div class="l">Campaigns</div></div>
        </div>
        <div class="grid2">
          <div class="panel"><h2>Bookings — last 14 days</h2><canvas id="chartBookings" height="150"></canvas></div>
          <div class="panel"><h2>Booking status</h2><canvas id="chartStatus" height="150"></canvas></div>
        </div>
        <div class="panel"><h2>Recent bookings</h2><div id="recentBookings"></div></div>
      </section>

      <!-- PLACES -->
      <section id="view-places" class="hide">
        <div class="toolbar"><div class="spacer"></div><button class="btn" id="claimPlaceBtn">🔎 Claim a Google place</button><button class="btn sage" id="addPlaceBtn" data-admin="1">+ Add place</button></div>
        <div class="panel" style="padding:6px 6px 0"><div id="placesTable"></div></div>
      </section>

      <!-- BOOKINGS -->
      <section id="view-bookings" class="hide">
        <div class="toolbar">
          <select id="bookingFilter" class="status"><option value="">All statuses</option><option>requested</option><option>confirmed</option><option>declined</option><option>completed</option></select>
          <div class="spacer"></div>
        </div>
        <div class="panel" style="padding:6px 6px 0"><div id="bookingsTable"></div></div>
      </section>

      <!-- VOUCHERS -->
      <section id="view-vouchers" class="hide">
        <div class="toolbar">
          <select id="voucherFilter" class="status"><option value="">All statuses</option><option>paid</option><option>redeemed</option></select>
          <div class="spacer"></div>
        </div>
        <div class="panel" style="padding:6px 6px 0"><div id="vouchersTable"></div></div>
      </section>

      <!-- ORDERS -->
      <section id="view-orders" class="hide">
        <div class="panel" style="padding:6px 6px 0"><div id="ordersTable"></div></div>
      </section>

      <!-- CAMPAIGNS -->
      <section id="view-campaigns" class="hide">
        <div class="toolbar"><div class="spacer"></div><button class="btn sage" id="addCampaignBtn">+ New campaign</button></div>
        <div class="panel" style="padding:6px 6px 0"><div id="campaignsTable"></div></div>
      </section>

      <!-- HOTSPOTS / EVENTS -->
      <section id="view-events" class="hide">
        <div class="toolbar"><div class="spacer"></div><button class="btn sage" id="addEventBtn">+ New hotspot</button></div>
        <div class="panel" style="padding:6px 6px 0"><div id="eventsTable"></div></div>
      </section>

      <!-- REPORTS -->
      <section id="view-reports" class="hide">
        <div class="panel">
          <h2>Generate report</h2>
          <div class="toolbar">
            <div><label class="fld">From</label><input type="date" id="repFrom" style="width:170px"/></div>
            <div><label class="fld">To</label><input type="date" id="repTo" style="width:170px"/></div>
            <div style="align-self:flex-end"><button class="btn" id="repRun">Generate</button></div>
          </div>
          <div id="reportSummary" class="kpis" style="margin-top:8px"></div>
          <div class="toolbar" style="margin-top:18px">
            <button class="btn ghost sm" data-export="bookings">⬇ Export bookings CSV</button>
            <button class="btn ghost sm" data-export="orders">⬇ Export orders CSV</button>
            <button class="btn ghost sm" data-export="places">⬇ Export places CSV</button>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- MODAL ROOT -->
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';
import { getFirestore, collection, getDocs, getDoc, addDoc, setDoc, doc, deleteDoc, updateDoc, query, where, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyANYIyuxNtP-of3AhrdXF0MS8BM73Ja6tM",
  authDomain: "spotly-6ca9a.firebaseapp.com",
  projectId: "spotly-6ca9a",
  storageBucket: "spotly-6ca9a.firebasestorage.app",
  messagingSenderId: "1096688153950",
  appId: "1:1096688153950:web:d6efe67040fee83dd84bcf",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Google Places API (New) key for the "Claim a Google place" search. This runs
// in the browser, so it MUST be an HTTP-referrer-restricted key allowing
// meetspotly.com (and have "Places API (New)" enabled). It is safe to expose a
// referrer-restricted key — like the Firebase apiKey above. Create one in
// Google Cloud → Credentials, restrict it to https://meetspotly.com/*, then
// paste it here. The app's iOS/Android key will NOT work from the web.
const PLACES_KEY = 'AIzaSyB0pdrghA-1hLPLw2glUJP6IuhyLnkUESA';
const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])));
const fmtDate = (ts) => { try { return ts?.toDate ? ts.toDate().toLocaleDateString() : ''; } catch { return ''; } };
const AMENITIES = ['playArea','foodOnSite','parking','animals','indoor','outdoor','water','arts','restroom','changing','shade','museum'];

// in-memory caches for reports
let cache = { places: [], bookings: [], orders: [], campaigns: [], vouchers: [] };

// Who's signed in + their role. Admins (admins/{uid}) see everything; merchants
// (merchants/{uid}) see only their own places, bookings and voucher sales.
let me = { uid: null, isAdmin: false, isMerchant: false, businessName: '' };

// ---------- Auth ----------
onAuthStateChanged(auth, async (user) => {
  if (user) {
    $('login').classList.add('hide');
    $('app').classList.remove('hide');
    $('who').textContent = user.email || user.uid;
    $('whoFoot').textContent = user.email || user.uid;
    // Resolve role before rendering so we scope data + hide admin-only tools.
    let isAdmin = false, isMerchant = false, businessName = '';
    try { isAdmin = (await getDoc(doc(db, 'admins', user.uid))).exists(); } catch {}
    try { const m = await getDoc(doc(db, 'merchants', user.uid)); isMerchant = m.exists(); businessName = m.data()?.businessName || ''; } catch {}
    me = { uid: user.uid, isAdmin, isMerchant, businessName };
    if (!isAdmin && !isMerchant) {
      $('app').innerHTML = `<div style="max-width:520px;margin:120px auto;text-align:center;font-family:system-ui">
        <h1 style="font-size:24px">This account isn't a business</h1>
        <p style="color:#666;margin:12px 0 22px">Sign up as a business in the Spotly app to manage your place and offers here.</p>
        <button class="btn ghost" id="naSignout">Sign out</button></div>`;
      document.getElementById('naSignout').onclick = () => signOut(auth);
      return;
    }
    applyRole();
    if (businessName) $('whoFoot').textContent = businessName;
    show('dashboard');
  } else {
    $('login').classList.remove('hide');
    $('app').classList.add('hide');
  }
});

// Show/hide admin-only nav + tools based on role.
function applyRole() {
  const merchantOnly = me.isMerchant && !me.isAdmin;
  document.querySelectorAll('[data-admin]').forEach((el) => el.classList.toggle('hide', !me.isAdmin));
  // Add-place is admin-only (merchants claim places in the app, with verification).
  const addBtn = $('addPlaceBtn'); if (addBtn) addBtn.classList.toggle('hide', !me.isAdmin);
}
const isMerchantOnly = () => me.isMerchant && !me.isAdmin;
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  try { await signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value); }
  catch (e) { $('loginErr').textContent = e.message.replace('Firebase: ', ''); }
};
$('signout').onclick = () => signOut(auth);

// ---------- Navigation ----------
const TITLES = { dashboard:'Dashboard', places:'Places', bookings:'Bookings', vouchers:'Voucher sales', orders:'Album orders', campaigns:'Campaigns', events:'Hotspots', reports:'Reports' };
$('nav').addEventListener('click', (e) => { const b = e.target.closest('button[data-view]'); if (b) show(b.dataset.view); });
function show(view) {
  // Guard: merchants can't open admin-only views even via stale state.
  if (!me.isAdmin && ['orders','campaigns','events','reports'].includes(view)) view = 'dashboard';
  document.querySelectorAll('#nav button').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.content > section').forEach((s) => s.classList.add('hide'));
  $('view-' + view).classList.remove('hide');
  $('pageTitle').textContent = TITLES[view];
  if (view === 'dashboard') loadDashboard();
  if (view === 'places') loadPlaces();
  if (view === 'bookings') loadBookings();
  if (view === 'vouchers') loadVouchers();
  if (view === 'orders') loadOrders();
  if (view === 'campaigns') loadCampaigns();
  if (view === 'events') loadEvents();
}

// Fetch a collection scoped to the signed-in merchant by a field (rules deny a
// full-collection read to non-admins, so we must constrain the query).
async function fetchMine(name, field) {
  try {
    const snap = await getDocs(query(collection(db, name), where(field, '==', me.uid)));
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) { return []; }
}

async function fetchAll(name, withOrder = true) {
  try {
    const q = withOrder ? query(collection(db, name), orderBy('createdAt', 'desc')) : collection(db, name);
    const snap = await getDocs(q);
    return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  } catch (e) {
    // fall back without orderBy if createdAt missing
    try { const snap = await getDocs(collection(db, name)); return snap.docs.map((d) => ({ id: d.id, ...d.data() })); } catch { return []; }
  }
}

// ---------- Dashboard ----------
let chartB, chartS;
async function loadDashboard() {
  let places, bookings, orders, campaigns, vouchers;
  if (isMerchantOnly()) {
    // Scoped reads only — rules deny full-collection access to merchants.
    const all = await fetchAll('places');
    places = all.filter((p) => p.ownerUid === me.uid);
    [bookings, vouchers] = await Promise.all([fetchMine('bookings','placeOwnerUid'), fetchMine('voucherOrders','placeOwnerUid')]);
    orders = []; campaigns = [];
  } else {
    [places, bookings, orders, campaigns, vouchers] = await Promise.all([fetchAll('places'), fetchAll('bookings'), fetchAll('orders'), fetchAll('campaigns'), fetchAll('voucherOrders')]);
  }
  cache = { places, bookings, orders, campaigns, vouchers };

  // Relabel KPIs for merchants (their own data; revenue instead of campaigns).
  const k3 = $('kpiOrders'), k4 = $('kpiCampaigns');
  if (isMerchantOnly()) {
    const sold = vouchers.length;
    const rev = {}; vouchers.forEach((s)=>{ rev[s.currencyCode]=(rev[s.currencyCode]||0)+(s.price||0); });
    const money = (n,c)=>{ const sym={KWD:'KD',BHD:'BD',OMR:'OMR',SAR:'SAR',AED:'AED',QAR:'QAR',USD:'$',EUR:'€',GBP:'£'}[c]||c||''; return ['$','€','£'].includes(sym)?`${sym}${n}`:`${n} ${sym}`; };
    document.querySelectorAll('#view-dashboard .kpi .l')[0].textContent = 'Your places';
    document.querySelectorAll('#view-dashboard .kpi .l')[2].textContent = 'Vouchers sold';
    document.querySelectorAll('#view-dashboard .kpi .l')[3].textContent = 'Voucher revenue';
    k3.textContent = sold;
    k4.textContent = Object.keys(rev).length ? Object.entries(rev).map(([c,a])=>money(a,c)).join(' · ') : '0';
  } else {
    const labels = document.querySelectorAll('#view-dashboard .kpi .l');
    labels[0].textContent = 'Curated places'; labels[2].textContent = 'Album orders'; labels[3].textContent = 'Campaigns';
    $('kpiOrders').textContent = orders.length;
    $('kpiCampaigns').textContent = campaigns.length;
  }
  $('kpiPlaces').textContent = places.length;
  $('kpiBookings').textContent = bookings.length;

  // last 14 days bookings
  const days = [], counts = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d.toLocaleDateString(undefined,{month:'short',day:'numeric'})); counts.push(0); }
  bookings.forEach((b) => { const t = b.createdAt?.toDate?.(); if (!t) return; const idx = 13 - Math.floor((Date.now() - t) / 86400000); if (idx >= 0 && idx < 14) counts[idx]++; });
  if (chartB) chartB.destroy();
  chartB = new Chart($('chartBookings'), { type:'bar', data:{ labels:days, datasets:[{ data:counts, backgroundColor:'#fa7959', borderRadius:6 }] }, options:{ plugins:{legend:{display:false}}, scales:{ y:{ beginAtZero:true, ticks:{precision:0} } } } });

  const byStatus = {}; bookings.forEach((b)=>{ const s=b.status||'requested'; byStatus[s]=(byStatus[s]||0)+1; });
  if (chartS) chartS.destroy();
  chartS = new Chart($('chartStatus'), { type:'doughnut', data:{ labels:Object.keys(byStatus), datasets:[{ data:Object.values(byStatus), backgroundColor:['#eebc4a','#398b77','#c94c2d','#9c5eaa','#54aad1'] }] }, options:{ plugins:{legend:{position:'bottom'}} } });

  $('recentBookings').innerHTML = bookings.length ? table(
    ['Place','Family','Date','Party','Status',''],
    bookings.slice(0,6).map((b)=>[`<b>${esc(b.placeName)}</b>`, esc(b.familyName||'—'), `${esc(b.date||'')} ${esc(b.time||'')}`, `${b.adults||0}a ${b.kids||0}k`, statusPill(b.status), ''])
  ) : '<div class="muted-note">No bookings yet.</div>';
}

// ---------- Places ----------
function verifyLinks(p){
  if (!p.ownerUid) return '';
  const bits = [];
  if (p.ownerPhone) bits.push(`<span>📞 ${esc(p.ownerPhone)}</span>`);
  if (p.ownerCivilIdUrl) bits.push(`<a href="${esc(p.ownerCivilIdUrl)}" target="_blank">Civil ID</a>`);

// ── Claim a Google place ──────────────────────────────────────────
// Search Google Places (New) and create a lightweight CLAIM record keyed by the
// Google place_id. We persist only the place_id (+ a minimal display snapshot)
// — the app overlays the merchant's vouchers onto the LIVE Google listing by
// matching place_id, so we never mirror Google's data.
async function searchGooglePlaces(textQuery) {
  if (!PLACES_KEY || PLACES_KEY.startsWith('PASTE_')) throw new Error('No Places key configured. Add a web-referrer Places key to admin.html (see PLACES_KEY comment).');
  const res = await fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': PLACES_KEY, 'X-Goog-FieldMask': 'places.id,places.displayName,places.formattedAddress,places.location,places.primaryTypeDisplayName' },
    body: JSON.stringify({ textQuery, maxResultCount: 8 }),
  });
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || 'Places search failed');
  return j.places || [];
}
$('claimPlaceBtn').onclick = () => openClaimModal();
function openClaimModal() {
  $('modalRoot').innerHTML = `
  <div class="modal-bg"><div class="modal">
    <h2>Claim a Google place</h2>
    <p class="muted-note" style="margin:0 0 12px">Search for the real listing. We link it by Google place ID so your offers show on the live place — no duplicate, no stale copy.</p>
    <div style="display:flex;gap:8px">
      <input id="cl_q" placeholder="e.g. The Scientific Center Kuwait" style="flex:1"/>
      <button class="btn" id="cl_search">Search</button>
    </div>
    <div id="cl_results" style="margin-top:12px"></div>
    <p id="cl_err" class="err"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="btn ghost" id="cl_cancel">Close</button>
    </div>
  </div></div>`;
  $('cl_cancel').onclick = () => $('modalRoot').innerHTML='';
  const run = async () => {
    const q = $('cl_q').value.trim(); if (!q) return;
    $('cl_err').textContent=''; $('cl_results').innerHTML='Searching…';
    try {
      const places = await searchGooglePlaces(q);
      if (!places.length) { $('cl_results').innerHTML='<div class="muted-note">No matches.</div>'; return; }
      $('cl_results').innerHTML = places.map((p)=>`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="flex:1">
            <div style="font-weight:700">${esc(p.displayName?.text||'—')}</div>
            <div style="color:var(--ink3);font-size:12px">${esc(p.primaryTypeDisplayName?.text||'')} · ${esc(p.formattedAddress||'')}</div>
          </div>
          <button class="btn sage sm" data-claim='${esc(JSON.stringify({id:p.id,name:p.displayName?.text||'',cat:p.primaryTypeDisplayName?.text||'',lat:p.location?.latitude,lng:p.location?.longitude}))}'>Claim</button>
        </div>`).join('');
      $('cl_results').querySelectorAll('[data-claim]').forEach((b)=> b.onclick = async ()=>{
        const d = JSON.parse(b.dataset.claim);
        b.disabled = true; b.textContent='…';
        try {
          // One canonical doc per place_id (doc id = place_id). Adopt an existing
          // one instead of forking a duplicate.
          const ref = doc(db, 'places', d.id);
          const snap = await getDoc(ref);
          if (snap.exists()) {
            const ex = snap.data();
            if (ex.ownerUid && ex.ownerUid !== me.uid && !me.isAdmin) throw new Error('That place is already claimed by another business.');
            if (!ex.ownerUid && !me.isAdmin) await updateDoc(ref, { ownerUid: me.uid }); // merchant adopts unowned
          } else {
            await setDoc(ref, {
              name: d.name, category: d.cat||'', lat: d.lat??null, lng: d.lng??null,
              googlePlaceId: d.id, ownerUid: me.isAdmin ? null : me.uid,
              status: me.isAdmin ? 'approved' : 'pending',
              promoted: false, promotionRequested: false,
              bookable: false, tone: 'sun', currency: 'KWD', vouchers: [],
              createdAt: serverTimestamp(),
            });
          }
          $('modalRoot').innerHTML=''; await loadPlaces();
          openVouchersModal(d.id); // jump straight to adding offers
        } catch(e){ $('cl_err').textContent = e.message.replace('Firebase: ',''); b.disabled=false; b.textContent='Claim'; }
      });
    } catch(e){ $('cl_results').innerHTML=''; $('cl_err').textContent = e.message; }
  };
  $('cl_search').onclick = run;
  $('cl_q').addEventListener('keydown', (e)=>{ if(e.key==='Enter') run(); });
}

const CURRENCIES = ['KWD','SAR','AED','QAR','BHD','OMR','USD','EUR','GBP'];
function voucherRowHtml(v){
  v = v || { id:'', label:'', price:'', value:'', active:true };
  const id = v.id || ('v'+Math.random().toString(36).slice(2,9));
  return `<div class="vRow" data-vid="${id}" style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
    <input class="vLabel" placeholder="Name (e.g. Arcade card)" value="${esc(v.label||'')}" style="flex:2"/>
    <input class="vPrice" type="number" step="any" placeholder="Price" value="${v.price??''}" style="flex:1"/>
    <input class="vValue" type="number" step="any" placeholder="Balance" value="${v.value??''}" style="flex:1"/>
    <label style="font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px"><input type="checkbox" class="vActive" ${v.active!==false?'checked':''} style="width:auto"/> Visible</label>
    <button class="danger vDel" type="button">✕</button>
  </div>`;
}
function openVouchersModal(placeId){
  const p = (cache.places||[]).find(x=>x.id===placeId) || {};
  const vouchers = Array.isArray(p.vouchers) ? p.vouchers : [];
  $('modalRoot').innerHTML = `
  <div class="modal-bg"><div class="modal">
    <h2>Offers — ${esc(p.name||'')}</h2>
    <p class="muted-note" style="margin:0 0 12px">Prepaid vouchers customers buy on this place's page (pay X, get Y balance on a card they redeem at the venue).</p>
    <div style="margin-bottom:12px"><label class="fld">Currency</label>
      <select id="v_cur">${CURRENCIES.map(c=>`<option ${(p.currency||'KWD')===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <label class="fld">Vouchers</label>
    <div id="v_rows">${(vouchers.length?vouchers:[null]).map(voucherRowHtml).join('')}</div>
    <button class="btn ghost sm" id="v_add" type="button">+ Add voucher</button>
    <p id="v_err" class="err"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="btn ghost" id="v_cancel">Cancel</button>
      <button class="btn sage" id="v_save">Save offers</button>
    </div>
  </div></div>`;
  const bindDel = ()=> $('v_rows').querySelectorAll('.vDel').forEach(b=> b.onclick=()=>{ b.closest('.vRow').remove(); });
  bindDel();
  $('v_add').onclick = ()=>{ $('v_rows').insertAdjacentHTML('beforeend', voucherRowHtml()); bindDel(); };
  $('v_cancel').onclick = ()=> $('modalRoot').innerHTML='';
  $('v_save').onclick = async ()=>{
    const rows = [...$('v_rows').querySelectorAll('.vRow')];
    const vouchers = [];
    for (const r of rows){
      const label = r.querySelector('.vLabel').value.trim();
      const price = parseFloat(r.querySelector('.vPrice').value);
      const value = parseFloat(r.querySelector('.vValue').value);
      if (!label && isNaN(price) && isNaN(value)) continue;
      if (isNaN(price) || price<=0){ $('v_err').textContent='Each voucher needs a price greater than 0.'; return; }
      vouchers.push({ id:r.dataset.vid, label, price, value:isNaN(value)?price:value, active:r.querySelector('.vActive').checked });
    }
    try{
      await updateDoc(doc(db,'places',placeId), { currency:$('v_cur').value, vouchers });
      $('modalRoot').innerHTML=''; loadPlaces();
    }catch(e){ $('v_err').textContent=e.message.replace('Firebase: ',''); }
  };
}

  $('eventsTable').querySelectorAll('[data-tog-ev]').forEach((b)=> b.onclick = async ()=>{ await updateDoc(doc(db,'events',b.dataset.togEv),{active: b.dataset.on!=='1'}); loadEvents(); });
}
$('addEventBtn').onclick = () => {
  $('modalRoot').innerHTML = `
  <div class="modal-bg"><div class="modal">
    <h2>Add a hotspot</h2>
    <div class="form-grid">
      <div class="full"><label class="fld">Title *</label><input id="e_title" placeholder="Eid weekend pop-up"/></div>
      <div><label class="fld">Partner</label><input id="e_partner" placeholder="24am"/></div>
      <div><label class="fld">Venue</label><input id="e_venue" placeholder="The Avenues"/></div>
      <div><label class="fld">Latitude *</label><input id="e_lat" type="number" step="any" placeholder="29.3033"/></div>
      <div><label class="fld">Longitude *</label><input id="e_lng" type="number" step="any" placeholder="47.9389"/></div>
      <div><label class="fld">Ends (date)</label><input id="e_end" type="date"/></div>
      <div class="full"><label class="fld">Photo URL</label><input id="e_photo" placeholder="https://…"/></div>
    </div>
    <p id="e_err" class="err"></p>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
      <button class="btn ghost" id="e_cancel">Cancel</button>
      <button class="btn sage" id="e_save">Add hotspot</button>
    </div>
  </div></div>`;
  $('e_cancel').onclick = () => $('modalRoot').innerHTML='';
  $('e_save').onclick = async () => {
    const title=$('e_title').value.trim(), lat=parseFloat($('e_lat').value), lng=parseFloat($('e_lng').value);
    if(!title||isNaN(lat)||isNaN(lng)){ $('e_err').textContent='Title, latitude and longitude are required.'; return; }
    const endsAt = $('e_end').value ? new Date($('e_end').value).getTime() : null;
    try{
      await addDoc(collection(db,'events'),{ title, partner:$('e_partner').value.trim()||null, venue:$('e_venue').value.trim()||null, lat, lng, photoUrl:$('e_photo').value.trim()||null, endsAt, active:true, tone:'plum', createdAt:serverTimestamp() });
      $('modalRoot').innerHTML=''; loadEvents();
    }catch(e){ $('e_err').textContent=e.message.replace('Firebase: ',''); }
  };
};

// ---------- Reports ----------
$('repRun').onclick = async () => {
  const [places, bookings, orders] = await Promise.all([fetchAll('places'), fetchAll('bookings'), fetchAll('orders')]);
  cache = { ...cache, places, bookings, orders };
  const from = $('repFrom').value ? new Date($('repFrom').value).getTime() : 0;
  const to = $('repTo').value ? new Date($('repTo').value).getTime()+86400000 : Date.now()+86400000;
  const inRange = (x)=>{ const t=x.createdAt?.toDate?.()?.getTime(); return t==null || (t>=from && t<=to); };
  const b = bookings.filter(inRange), o = orders.filter(inRange);
  $('reportSummary').innerHTML = [
    ['Bookings', b.length], ['Confirmed', b.filter(x=>x.status==='confirmed').length],
    ['Album orders', o.length], ['Curated places', places.length],
  ].map(([l,n])=>`<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
};
document.querySelectorAll('[data-export]').forEach((btn)=> btn.onclick = ()=> exportCSV(btn.dataset.export));
function exportCSV(name){
  const rows = cache[name] || [];
  if(!rows.length){ alert('Nothing to export — open '+name+' first (or Generate the report).'); return; }
  const cols = [...new Set(rows.flatMap(r=>Object.keys(r)))].filter(k=>k!=='createdAt');
  const csv = [cols.join(',')].concat(rows.map(r=>cols.map(c=>{ let v=r[c]; if(v&&v.toDate) v=v.toDate().toISOString(); if(Array.isArray(v)) v=v.join('|'); v=v==null?'':String(v).replace(/"/g,'""'); return /[",\n]/.test(v)?`"${v}"`:v; }).join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=`spotly-${name}-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

// ---------- helpers ----------
function table(headers, rows){
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function statusPill(s){ s=s||'requested'; const cls=s==='confirmed'||s==='completed'?'ok':s==='declined'?'no':s==='requested'?'req':'muted'; return `<span class="pill ${cls}">${esc(s)}</span>`; }
</script>
